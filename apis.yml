aid: guardhat
name: Guardhat
description: >-
  Guardhat (now operating as Aatmunn) is an industrial safety and asset
  intelligence platform serving more than 250 companies across oil & gas,
  utilities, logistics and warehousing, chemicals, mining, infrastructure, and
  manufacturing. Its SPANR platform is a unified intelligence layer that
  collects data from connected safety devices and wearables, normalizes it into
  a single source of truth, applies business logic, and surfaces insights
  through a suite of applications for digital safety inspections, lone worker
  safety, gas detection, human condition monitoring, control access zoning, and
  asset tracking. Originally known for connected hard hats and wearable safety
  technology, the company rebranded from Guardhat to Aatmunn. Guardhat is a
  venture-backed portfolio company of General Catalyst. This profile has been
  enriched from the company's public web presence; no public developer API or
  OpenAPI surface was found at the time of enrichment.
